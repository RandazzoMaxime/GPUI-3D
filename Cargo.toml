[workspace]
resolver = "2"
members = ["shell", "GPUI-WGPU", "GPUI-METAL", "GPUI-VULKAN", "bench"]
exclude = ["vendor/wgpui", "vendor/priority-threadpool"]

[workspace.dependencies]
gpui = { package = "gpui-ce", path = "vendor/wgpui" }
# Même version que le fork : un seul wgpu, donc un seul Device partagé UI / 3D. Tous ses backends.
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "metal", "vulkan", "vulkan-portability", "dx12", "gles", "wgsl"] }
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
gpui3d-shell = { path = "shell" }

# Copie corrigée : course fetch_add/push (jobs orphelins ⇒ timers GPUI perdus).
[patch."https://github.com/tristanpoland/priority-threadpool"]
priority-threadpool = { path = "vendor/priority-threadpool/crates/priority-threadpool" }

[profile.dev]
debug = "line-tables-only"

# Le chrome et le GPU doivent tourner optimisés même en debug (mesuré en conditions réelles).
[profile.dev.package.gpui-ce]
opt-level = 3
[profile.dev.package.wgpu]
opt-level = 3
[profile.dev.package.wgpu-core]
opt-level = 3
[profile.dev.package.wgpu-hal]
opt-level = 3
[profile.dev.package.naga]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
[profile.dev.package.cosmic-text]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Mesures et profilage : optimisé comme release, compilation rapide, symboles pour `sample`.
[profile.profiling]
inherits = "release"
lto = false
codegen-units = 16
debug = "line-tables-only"
