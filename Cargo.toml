[workspace]
resolver = "2"
members = ["shell", "GPUI-WGPU", "GPUI-METAL", "GPUI-VULKAN", "GPUI-DX12", "GPUI-OPENGL"]
exclude = ["vendor/wgpui", "vendor/priority-threadpool"]

# Kit à copier, pas des crates à publier.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "0BSD"
publish = false

[workspace.dependencies]
# Sans features : chaque variante choisit son backend d'UI via le shell (`wgpu` ou natif).
gpui = { package = "gpui-ce", path = "vendor/wgpui", default-features = false, features = ["font-kit"] }
# Même version que le fork : un seul wgpu, donc un seul Device partagé UI / 3D. Tous ses backends.
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "metal", "vulkan", "vulkan-portability", "dx12", "gles", "wgsl"] }
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
gpui3d-shell = { path = "shell", default-features = false }
# D3D12 natif (GPUI-DX12, GPUI-OPENGL) + WGL (GPUI-OPENGL) : même version que wgpu-hal 30.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

# Copie corrigée : course fetch_add/push (jobs orphelins ⇒ timers GPUI perdus).
[patch."https://github.com/tristanpoland/priority-threadpool"]
priority-threadpool = { path = "vendor/priority-threadpool/crates/priority-threadpool" }

[profile.dev]
debug = "line-tables-only"

# Le chrome et le GPU doivent tourner optimisés même en debug (mesuré en conditions réelles).
[profile.dev.package.gpui-ce]
opt-level = 3
[profile.dev.package.wgpu]
opt-level = 3
[profile.dev.package.wgpu-core]
opt-level = 3
[profile.dev.package.wgpu-hal]
opt-level = 3
[profile.dev.package.naga]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
[profile.dev.package.cosmic-text]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
