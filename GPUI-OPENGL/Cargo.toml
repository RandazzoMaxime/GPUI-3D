[package]
name = "gpui-opengl"
version = "0.1.0"
edition = "2024"

[dependencies]
# Full natif : l'UI de GPUI rend elle aussi en OpenGL (WGL), sans wgpu.
gpui3d-shell = { workspace = true, features = ["opengl"] }
bytemuck.workspace = true

[target.'cfg(windows)'.dependencies]
# OpenGL natif (WGL). Aucune dépendance wgpu.
windows = { workspace = true }

[build-dependencies]
# Bindings GL 4.5 core, générés depuis le registre Khronos.
gl_generator = "0.14"
