[package]
name = "gpui-dx12"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Full natif : l'UI de GPUI rend elle aussi en D3D12 (windows-rs), sans wgpu.
gpui3d-shell = { workspace = true, features = ["dx12"] }
bytemuck.workspace = true

[target.'cfg(windows)'.dependencies]
# D3D12 natif. Aucune dépendance wgpu : GPUI ne fournit que des poignées brutes.
windows = { workspace = true }
