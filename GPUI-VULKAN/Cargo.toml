[package]
name = "gpui-vulkan"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Full natif : l'UI de GPUI rend elle aussi en Vulkan (ash), sans wgpu.
gpui3d-shell = { workspace = true, features = ["vulkan"] }
bytemuck.workspace = true
# Vulkan natif. Aucune dépendance wgpu : GPUI ne fournit que des poignées brutes.
ash = "0.38"

[build-dependencies]
# Compilateur hors ligne GLSL → SPIR-V (remplaçable par glslc / shaderc).
# `wgsl-in` : naga 30 ne compile pas `glsl-in` seul (module interpolator gaté).
naga = { version = "30", features = ["glsl-in", "wgsl-in", "spv-out"] }
