[package]
name = "gpui3d-shell"
version = "0.1.0"
edition = "2024"

[features]
# Backend du renderer de l'UI : wgpu (abstraction multi-API) ou natif (Vulkan, D3D12, OpenGL).
wgpu = ["gpui/wgpu", "dep:wgpu"]
vulkan = ["gpui/vulkan"]
dx12 = ["gpui/dx12"]
opengl = ["gpui/opengl"]

[dependencies]
gpui.workspace = true
wgpu = { workspace = true, optional = true }
glam.workspace = true
