[package]
name = "gpui3d-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Backend du renderer de l'UI : wgpu (abstraction multi-API) ou natif (Vulkan, D3D12, OpenGL, Metal).
wgpu = ["gpui/wgpu", "dep:wgpu"]
vulkan = ["gpui/vulkan"]
dx12 = ["gpui/dx12"]
opengl = ["gpui/opengl"]
metal = ["gpui/metal"]

[dependencies]
gpui.workspace = true
wgpu = { workspace = true, optional = true }
glam.workspace = true
