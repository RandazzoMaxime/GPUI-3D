[package]
name = "gpui-metal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Full natif : l'UI de GPUI rend elle aussi en Metal, sans wgpu.
gpui3d-shell = { workspace = true, features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Metal natif (objc2). Aucune dépendance wgpu : GPUI ne fournit que des poignées brutes.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3.2"
